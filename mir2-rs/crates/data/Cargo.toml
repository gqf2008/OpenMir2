[package]
name = "mir2-data"
version = "0.1.0"
edition = "2021"
description = "mir2_data 表加载（sqlx）与 Envir 数据文件解析（Exps.conf / MonItems）"

[dependencies]
mir2-shared = { path = "../shared" }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
encoding_rs = "0.8"

[lints]
workspace = true
