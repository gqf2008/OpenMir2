[package]
name = "mir2-world-bevy"
version = "0.1.0"
edition = "2021"
description = "世界模拟 crate：bevy_ecs ECS 内核（实体存储 + tick 骨架）+ D3 掉落系统 + S5 自 crates/world 并入的模拟层"

[dependencies]
mir2-shared = { path = "../shared" }
mir2-data = { path = "../data" }
mir2-formula = { path = "../formula" }
bevy_ecs = { version = "=0.19.1", default-features = false }
# 说明（§4.2.2 四条硬约束）：只取 bevy_ecs（+ 可选 bevy_app），**不取整个引擎**；
# bevy_tasks 会作为 bevy_ecs 的传递依赖出现，但本 crate 不引用其并行 API
#（由本 crate 的 tests/bevy_drop_parity.rs::no_parallel_guard 源码扫描 +
#  tests/no_parallel.rs（S5 自 crates/world 并入）的直接依赖白名单双重钉住）。

[lints]
workspace = true
