[package]
name = "game-gate"
version = "0.1.0"
edition = "2021"
description = "Rust 版 GameGate/RunGate（M2 入口）：客户端 7200 ↔ GameSvr 5000 的 20B ServerMessage + GM_* 链路"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"

[dependencies]
mir2-protocol = { path = "../../crates/protocol" }
# 编码统一入口（.NET cp936 逐字节等价）：`cp936::encode_gb2312_dotnet`。
mir2-script = { path = "../../crates/script" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
anyhow = "1"
# gb2312(cp936) 域名：客户端登录串里的账号/角色名是 GBK 字节。**编码/解码都走 `mir2-script`
# 的 `cp936`**（.NET 逐字节等价；E-1/E-8）；本 crate 不再依赖 `encoding_rs`。

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process"] }
