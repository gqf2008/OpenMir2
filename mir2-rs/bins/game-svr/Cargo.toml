[package]
name = "game-svr"
version = "0.1.0"
edition = "2021"
description = "Rust 版 GameSvr 世界宿主（M2 主体）：网关 5000 侧 20B ServerMessage + GM_* 链路 + 单线程 World tick"
license = "MIT"

[lints.rust]
# **A43 例外（Leader 批准，最小落点）**：原 `forbid` 无法被模块级 `#[allow(unsafe_code)]` 覆盖；
# 这里把 crate 默认改为 `deny`（默认仍拒绝），唯一例外是 `lib.rs` 的 `thread_cpu` 观测模块
# （一次只读 `GetThreadTimes` 调用，无指针保持/无内存写）。
unsafe_code = "deny"

[lints.clippy]
all = "deny"

[features]
# **M1a ②**：⑤ 跨区帧旁路打标（`(tick, socket, sha256(body))`）。**默认关** ⇒ 默认构建里
# 一行都不编译（零成本）；验收专用构建用 `--features frame-src`，从同一棵树出二进制。
frame-src = ["dep:sha2"]

[dependencies]
# **A43e**：全局分配器换成 mimalloc。依据（2026-11-25 8 区/1000 人）：区线程执行段
# `cpu ≈ wall`（93.75 vs 96.7 ms）而总量恒定 ≈370 事件/tick，单价随**线程数**上升 ⇒
# Windows 默认堆（进程堆临界区）的跨线程争用是本次容量瓶颈；换分配器**不改任何语义**。
# 版本钉死；离线缓存已核（mimalloc 0.1.52 + libmimalloc-sys 0.1.49 + cc）。
mimalloc = "=0.1.52"
mir2-protocol = { path = "../../crates/protocol" }
# 跨服（G11/A3）：PlanesMessage 分类 + PlanesClient/Server 状态机（见 docs/g11-planes-design-20261108.md）
mir2-planes = { path = "../../crates/planes" }
mir2-shared = { path = "../../crates/shared" }   # HUtil32.GetValidStr3 的既有 Rust 实现（别重复造）
mir2-world-bevy = { path = "../../crates/world-bevy" }
mir2-data = { path = "../../crates/data" }   # StdItem 模板（Index → StdItem）：帧 50/41 的 StdItem.Shape 输入 + 52/752 能力接缝（与 envir 同源）
mir2-formula = { path = "../../crates/formula" }   # `RecalcLevelAbilitys` 的逐行移植（登录时先算等级派生 Abil，见 ability.rs §14）
mir2-envir = { path = "../../crates/envir" }   # Envir *.map 真地图加载 + 逻辑名→map_id（集成点 ④）
mir2-storage = { path = "../../crates/storage" } # `LegacyDsn`：`[DataBase] ConnctionString` → sqlx URL（勿再手写一份）
mir2-script = { path = "../../crates/script" }   # NPC 脚本运行时（M3⑥-实现 3：`@Login`/`@StdModeFunc*`/说词帧接线，见 src/npc.rs）
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }   # 建池读 stditems（与 mir2-data 同源）
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
anyhow = "1"
encoding_rs = "0.8"
# 帧 46 `SM_DAYCHANGING` 的 `Bright = M2Share.GameTime`：oracle `SystemProcessor.GetGameTime()` 按
# `DateTime.Now.Hour` 刷新（`SystemProcessor.cs:98-134`）⇒ 读真实本地时钟（`chrono::Local`，走系统时区）。
chrono = "0.4"
# `goldsales.UseItems` 的 `.NET UserItem` JSON 形态桥接（⑩-2 只读加载接线；原为 dev-dep，bin 侧接线后提为 dep）。
serde_json = "1"
# `.NET` 的 `byte[] Desc` 默认序列化成 base64 字符串（`ClientUserItem.cs:19-27`）；已在 Cargo.lock（经 sqlx）。
base64 = "0.22"
# 卡 `openmir2-gd-ack-boot-millis`：`+GD/<t>` 的 t 是 oracle `Environment.TickCount`（开机毫秒，int32）。
# 本 workspace 所有 crate 都 `unsafe_code = "forbid"`，不能直接调 Win32 `GetTickCount(64)`；
# `uptime_lib` 在 Windows 上就是 `GetTickCount64() -> Duration::from_millis` 的安全封装（MIT）。
# 固定版本（=）以免补丁版漂移；供应链评估见卡面 patch body。
uptime_lib = "=0.3.2"
# 仅 `frame-src` 特性（M1a 验收构建）用：旁路日志的 sha256(body) 与外部 frames.ndjson 联表。
# 默认构建不编译（optional + feature 门）；测试仍用下方 dev-dependency 的同名项。
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process"] }
serde_json = "1"   # feature.rs 用例回读 oracle 实测向量（tests/parity/m3/fixtures/feature_vectors.json）；bin 侧亦用
sha2 = "0.10"      # 卡 openmir2-magic-serverconf-batch-plan §6.7：真实部署 Server.conf 的 sha 记录；
                     # 仓内 bins/mir2-mcp、bins/res-svr、crates/protocol、tools/replay 已用同一 0.10（非新增供应链面）

[build-dependencies]
mir2-build-meta = { path = "../../crates/build-meta" }

[target.'cfg(windows)'.dependencies]
# **A43**：线程 CPU 时间（`GetThreadTimes`）。固定 0.48.0——workspace Cargo.lock 已含该版本
# （经其他依赖），不引入新版本供应链。
windows-sys = { version = "0.48.0", features = ["Win32_Foundation", "Win32_System_Threading"] }
