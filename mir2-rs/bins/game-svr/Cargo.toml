[package]
name = "game-svr"
version = "0.1.0"
edition = "2021"
description = "Rust 版 GameSvr 世界宿主（M2 主体）：网关 5000 侧 20B ServerMessage + GM_* 链路 + 单线程 World tick"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dependencies]
mir2-protocol = { path = "../../crates/protocol" }
mir2-shared = { path = "../../crates/shared" }   # HUtil32.GetValidStr3 的既有 Rust 实现（别重复造）
mir2-world = { path = "../../crates/world" }
mir2-data = { path = "../../crates/data" }   # StdItem 模板（Index → StdItem）：帧 50/41 的 StdItem.Shape 输入 + 52/752 能力接缝（与 envir 同源）
mir2-formula = { path = "../../crates/formula" }   # `RecalcLevelAbilitys` 的逐行移植（登录时先算等级派生 Abil，见 ability.rs §14）
mir2-envir = { path = "../../crates/envir" }   # Envir *.map 真地图加载 + 逻辑名→map_id（集成点 ④）
mir2-storage = { path = "../../crates/storage" } # `LegacyDsn`：`[DataBase] ConnctionString` → sqlx URL（勿再手写一份）
mir2-script = { path = "../../crates/script" }   # NPC 脚本运行时（M3⑥-实现 3：`@Login`/`@StdModeFunc*`/说词帧接线，见 src/npc.rs）
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }   # 建池读 stditems（与 mir2-data 同源）
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
anyhow = "1"
encoding_rs = "0.8"
# 帧 46 `SM_DAYCHANGING` 的 `Bright = M2Share.GameTime`：oracle `SystemProcessor.GetGameTime()` 按
# `DateTime.Now.Hour` 刷新（`SystemProcessor.cs:98-134`）⇒ 读真实本地时钟（`chrono::Local`，走系统时区）。
chrono = "0.4"
# `goldsales.UseItems` 的 `.NET UserItem` JSON 形态桥接（⑩-2 只读加载接线；原为 dev-dep，bin 侧接线后提为 dep）。
serde_json = "1"
# `.NET` 的 `byte[] Desc` 默认序列化成 base64 字符串（`ClientUserItem.cs:19-27`）；已在 Cargo.lock（经 sqlx）。
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process"] }
serde_json = "1"   # feature.rs 用例回读 oracle 实测向量（tests/parity/m3/fixtures/feature_vectors.json）；bin 侧亦用
