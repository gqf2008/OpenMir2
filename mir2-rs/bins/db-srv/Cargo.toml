[package]
name = "db-srv"
version = "0.1.0"
edition = "2021"
description = "Rust 版 DBSrv（M1）：SelGate↔DBSrv 5100 内部链路 + 角色列表/建删选角经 sqlx 接 mir2_db"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"

[dependencies]
mir2-protocol = { path = "../../crates/protocol" }
mir2-storage = { path = "../../crates/storage" }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }
anyhow = "1"
# `get_item_slots` 用 `TryStreamExt::try_next` 逐行读（复刻 C# `while (dr.Read())` 的
# 「读失败保留已读行」语义；G7 物品表读失败不整表放弃）。
futures-util = "0.3"
# GB2312(cp936) 域：C# `HUtil32.GetBytes` 用于 1100 取档帧的 `ChrName`；
# 差异登记同 whitelist A-14（`encoding_rs::GBK` 近似 .NET cp936）。
encoding_rs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "process"] }
# tests/quest_no_persist.rs：读 M1 跨读基线（`characters_quest` 两侧 0 行）做任务态不落库门禁。
serde_json = "1"
