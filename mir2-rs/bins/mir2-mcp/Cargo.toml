[package]
name = "mir2-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP（rmcp，stdio）服务：把 GM 命令目录与开区配置（Server.conf 白名单键）以工具形式暴露给本地 agent"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dependencies]
rmcp = { version = "3.8.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
serde_json = "1"
