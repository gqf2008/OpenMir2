[package]
name = "mir2-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP（rmcp，stdio）服务：把 GM 命令目录与开区配置（Server.conf 白名单键）以工具形式暴露给本地 agent"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dependencies]
rmcp = { version = "3.8.0", features = [
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Streamable HTTP 传输的 HTTP/1.1 服务端：hyper 1 + hyper-util（TowerToHyperService）
# + http-body-util（BodyExt/Empty/Full）。不引入 axum（卡 openmir2-mcp-streamable-http）。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
serde_json = "1"
