[package]
name = "replay"
version = "0.1.0"
edition = "2021"
description = "Golden-capture / oracle-vector replay gate: byte-exact decode-encode round-trip, field parity, stage coverage, sabotage red-checks"
license = "MIT"

# workspace 公共面（unsafe_code=forbid + clippy all=deny）+ A 线自加 pedantic。
# 不继承 [lints] workspace=true：workspace 表不含 pedantic（避免约束其他线），
# 这里内联全量以保持 A 线口径（门禁命令含 -D warnings，pedantic 警告即失败）。
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"

[dependencies]
mir2-protocol = { path = "../../crates/protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
