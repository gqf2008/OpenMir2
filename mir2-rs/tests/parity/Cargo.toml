[package]
name = "mir2-parity-tests"
version = "0.1.0"
edition = "2021"
description = "D 线对拍门禁：RNG / 经验曲线 / 掉落公式 / 表加载条数"
publish = false

[dependencies]
mir2-shared = { path = "../../crates/shared" }
mir2-data = { path = "../../crates/data" }
mir2-formula = { path = "../../crates/formula" }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
