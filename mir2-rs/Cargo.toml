[workspace]
resolver = "2"
members = [
    # A 线：协议（crates/protocol、crates/storage）+ 工具（tools/*）
    "crates/protocol",
    "crates/storage",
    "tools/msgcodegen",
    "tools/replay",
    # D 线：数据层 + 数值公式
    "crates/shared",
    "crates/world",
    "crates/world-bevy",
    "crates/data",
    "crates/formula",
    "tests/parity",
    # B 线：脚本引擎（crates/script）+ 工具（crates/script-tool）
    "crates/script",
    "crates/script-tool",
]

# 多线共用 workspace：members 只按行追加自己的 crate，不改动别人的行（见设计文档 §12.4）。
# 各线范围见 crates/*/Cargo.toml 的 description。

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
# A 线 crate 额外启用 pedantic（在各 crate 的 Cargo.toml 内联声明；
# 不放进 workspace 是因为会对其他线的既有代码施加未经其 owner 评审的约束）。

[profile.release]
debug = true
