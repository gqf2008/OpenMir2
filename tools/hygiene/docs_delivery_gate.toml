# 本仓当前没有「不存在但必须引用」的路径；出现时在这里逐条登记（带 reason）。
# [[external_paths]]
# path = "docs/foo"
# reason = "..."

[[claims]]
id = "delivery-report-cond6-freeze-baseline"
file = "docs/delivery-report-20261025-final.md"
# anchor 取**稳定部分**（命令本身），不含期望值——否则数字一变就变成 rot 而不是 claim-stale。
anchor = "git diff --stat 6b3aee870 HEAD -- src/ sql/"
title = "条件⑥ 冻结基线：git diff --stat 6b3aee870 HEAD -- src/ sql/ 为空"
kind = "diff_empty"
base = "6b3aee870"
head = "HEAD"
paths = ["src/", "sql/"]

[[claims]]
id = "needs-human-run3-list-count"
file = "docs/needs-human-20261025.md"
anchor = "bash tools/window/run_batch.sh --list"
title = "owner 开窗勾选项：run_batch --list ⇒ 24（blocked 2 ⇒ 入批 22）"
kind = "command_output"
# `--list` 只读、<1s；`bash` 不可用时本门 fail-closed（rc=2，登记表 rot 文案里说明）。
argv = ["bash", "tools/window/run_batch.sh", "--list"]
expect = "场景数 24（blocked 2 ⇒ 入批 22）"

# 做不到的形态：**显式登记，不假装覆盖**（卡 known_limits）。
[[unsupported_claims]]
form = "任意 shell 管道 / 重定向 / 多命令串联（如 `git log … | wc -l ⇒ 33`）"
reason = "本门不解释 shell；要覆盖请把命令改成自身输出可比对串（kind=command_output）或按 diff_empty 的 name_regex 表达，不要指望本门解析管道"

[[unsupported_claims]]
form = "散文式断言（「已完成」「全绿」且无命令可复算）"
reason = "「一段散文是否仍然为真」无法通用机判（卡 known_limits）——本门只做结构性、可证伪的检查，不做语义判断"

[[unsupported_claims]]
form = "需要真窗口 / 外部产物 / 网络的命令（goal_gate --full、run3 实跑、E:/tmp 产物哈希）"
reason = "没有证据就不能判；本门在合并门上跑，不能起栈、不能依赖 E:/tmp"

[[unsupported_claims]]
form = "域外历史叙事文档里的过时数字（如 4 份旧报告仍写 `场景数 24（blocked 3 ⇒ 入批 21）`）"
reason = "历史叙事文档不在判定域（它们引用的是当时的记录）——**本门 GREEN ≠ 全仓没有过时数字**，别把它当全仓保证"
